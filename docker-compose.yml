services:
  # 1. Banco de Dados MySQL
  mysqldb:
    image: mysql:8.0
    container_name: unibiblio-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Back-end (Spring Boot)
  backend:
    build:
      context: ../ADS_Equipe2_Biblioteca_Back
      dockerfile: Dockerfile
    container_name: unibiblio-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysqldb:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      mysqldb:
        condition: service_healthy

  # 3. Front-end (Angular + Nginx)
  frontend:
    build:
      context: ../ADS_Equipe2_Biblioteca_Front
      dockerfile: Dockerfile
    container_name: unibiblio-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: